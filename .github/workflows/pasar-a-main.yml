name: Pasar cambios de Claude a main
on:
  push:
    branches: ['claude/**']
permissions:
  contents: write
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unir a main
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout main
          git merge --no-edit "origin/${GITHUB_REF_NAME}" || { git merge --abort; git merge --no-edit -X theirs "origin/${GITHUB_REF_NAME}"; }
          git push origin main
          git push origin --delete "${GITHUB_REF_NAME}" || true
